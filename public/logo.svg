<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b5b2e"/>
      <stop offset="1" stop-color="#574A24"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- four-point sparkle, echoes the ✦ motif used across the site -->
  <path
    d="M128 40
       C 132 92 138 106 190 116
       C 138 126 132 140 128 192
       C 124 140 118 126 66 116
       C 118 106 124 92 128 40 Z"
    fill="#FAE8B4"
  />

  <!-- trigger bolt, cut through the sparkle's core -->
  <path
    d="M140 84 L104 132 H124 L112 176 L156 122 H134 Z"
    fill="#574A24"
  />
  <path
    d="M140 84 L104 132 H124 L112 176 L156 122 H134 Z"
    fill="none"
    stroke="#FAE8B4"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- pulse node, top-right: signals "on-chain / live" -->
  <circle cx="196" cy="60" r="9" fill="#CBBD93"/>
</svg>
